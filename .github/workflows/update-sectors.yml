name: Sektordaten aktualisieren

on:
  schedule:
    # Yahoo-Kurse macht der Cloudflare-Worker STÜNDLICH. Diese Action ist nur
    # noch für Gemini (Perlensuche + News + Inflationsprognose) und den
    # Finnhub-Scan zuständig, und die laufen ab jetzt nur noch EINMAL PRO
    # WERKTAG (Mo–Fr). Am Wochenende bewegen sich keine Kurse, und die
    # 30-Tage-Fenster rechnet das System selbst weiter.
    # Zwei Slots nur als Absicherung gegen GitHubs Cron-Jitter — das Skript
    # selbst lässt über scan.heavyDay pro Tag ohnehin nur einen vollen Lauf zu.
    - cron: '13 6 * * 1-5'
    - cron: '43 9 * * 1-5'
  workflow_dispatch:         # manueller Start möglich
    inputs:
      force_heavy:
        description: 'Vollen Lauf erzwingen (Gemini+Finnhub, ignoriert 6h-Takt)'
        type: boolean
        default: false
      debug:
        description: 'Gemini-Debug-Logging (rohe Antworten/Verwerfungsgründe)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sektordaten aktualisieren (Yahoo + Finnhub + Gemini)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Ein voller Lauf pro Werktag. Das Skript setzt scan.heavyDay und
          # lehnt weitere volle Läufe am selben Tag ab; HEAVY_GAP_H ist nur noch
          # die Untergrenze zwischen zwei Läufen. 0 = manuell erzwingen.
          HEAVY_GAP_H: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_heavy) && '0' || '12' }}
          GEMINI_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug) && '1' || '' }}
        run: node scripts/update-sectors.mjs

      - name: Änderungen committen
        run: |
          if git diff --quiet sectordata.json history.json; then
            echo "Keine Änderungen."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sectordata.json history.json
            git commit -m "Sektordaten aktualisiert ($(date -u +%Y-%m-%d))"
            # bis zu 3 Versuche: bei parallelem Push (z. B. manueller Commit) erst rebasen
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push abgelehnt – rebase und erneut versuchen ($i)…"
              git pull --rebase -X ours origin main || git rebase --abort
            done
          fi
